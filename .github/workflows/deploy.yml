name: Deploy New Ponton Piers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e

            REPO=/var/www/www-root/data/www/new.ponton-piers.ru
            APP=$REPO/app

            echo "=== Git configuration ==="
            git config --global --add safe.directory "$REPO"

            cd "$APP"

            echo "=== Git update ==="
            # Avoid writing the root-owned remote-tracking reflog on the server.
            git -c core.logAllRefUpdates=false fetch origin main
            git reset --hard origin/main

            echo "=== Install dependencies ==="
            /usr/local/bin/bun install --frozen-lockfile

            echo "=== Build ==="
            /usr/local/bin/bun run build

            echo "=== Restart application ==="
            sudo -n systemctl restart new-ponton-piers.service

            echo "=== Check application ==="
            sudo -n systemctl is-active --quiet new-ponton-piers.service

            echo "=== Deployment successful ==="
