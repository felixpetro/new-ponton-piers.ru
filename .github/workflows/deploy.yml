name: Deploy New Ponton Piers

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run automated tests
        run: bun run test
      - name: Run lint
        run: bun run lint
      - name: Build staging configuration
        env:
          SITE_URL: https://new.ponton-piers.ru
          SITE_ENV: staging
          VITE_SITE_URL: https://new.ponton-piers.ru
          VITE_SITE_ENV: staging
        run: bun run build

  deploy:
    needs: validate
    runs-on: ubuntu-24.04

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: GITHUB_SHA
          script: |
            set -e

            REPO=/var/www/www-root/data/www/new.ponton-piers.ru
            APP=$REPO/app

            echo "=== Prepare application directory ==="
            mkdir -p "$APP"
            cd "$APP"

            echo "=== Remember dependency state ==="
            OLD_DEPS_HASH=""
            if [ -f "$APP/package.json" ] && [ -f "$APP/bun.lock" ]; then
              OLD_DEPS_HASH=$(sha256sum "$APP/package.json" "$APP/bun.lock" | sha256sum | cut -d' ' -f1)
            fi

            echo "=== Download source ==="
            TMP=$(mktemp -d)
            trap 'rm -rf "$TMP"' EXIT
            curl -fsSL "https://github.com/felixpetro/new-ponton-piers.ru/archive/${GITHUB_SHA}.tar.gz" -o "$TMP/source.tar.gz"
            tar -xzf "$TMP/source.tar.gz" -C "$TMP"
            SRC=$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | head -n 1)

            echo "=== Sync application ==="
            cp -a "$SRC/app"/. "$APP"/

            echo "=== Download local image assets ==="
            mkdir -p "$APP/public/images"
            curl -fsSL "https://felixpetro.github.io/ponton-piers.ru/images/logo.svg" -o "$APP/public/images/logo.svg"
            curl -fsSL "https://felixpetro.github.io/ponton-piers.ru/images/pontoon-background.png" -o "$APP/public/images/pontoon-background.png"

            for image in piers-ponton naves-ponton dom-ponton bani-ponton besedka-ponton scena-ponton doc-ponton rest-ponton; do
              curl -fsSL "https://ponton-piers.ru/assets/cache_image/images/${image}_760x400_898.png" -o "$APP/public/images/${image}_760x400_898.png"
              cp "$APP/public/images/${image}_760x400_898.png" "$APP/public/images/${image}.png"
            done

            curl -fsSL "https://ponton-piers.ru/assets/cache_image/assets/avto/img/sertificate/sert-9001_215x300_90b.jpeg" -o "$APP/public/images/sert-9001.jpeg"
            curl -fsSL "https://ponton-piers.ru/assets/cache_image/assets/avto/img/sertificate/sert-14001_215x300_90b.jpeg" -o "$APP/public/images/sert-14001.jpeg"
            curl -fsSL "https://ponton-piers.ru/assets/cache_image/assets/avto/img/sertificate/sert-45001_215x300_90b.jpeg" -o "$APP/public/images/sert-45001.jpeg"
            curl -fsSL "https://ponton-piers.ru/assets/cache_image/assets/avto/img/sertificate/sert-idr-1_215x300_90b.jpeg" -o "$APP/public/images/sert-idr-1.jpeg"

            echo "=== Check dependencies ==="
            NEW_DEPS_HASH=$(sha256sum "$APP/package.json" "$APP/bun.lock" | sha256sum | cut -d' ' -f1)
            if [ ! -d "$APP/node_modules" ] || [ "$OLD_DEPS_HASH" != "$NEW_DEPS_HASH" ]; then
              echo "=== Install dependencies ==="
              /usr/local/bin/bun install --frozen-lockfile
            else
              echo "=== Dependencies unchanged; skip install ==="
            fi

            echo "=== Configure staging SEO and generate robots/sitemap ==="
            export SITE_URL="https://new.ponton-piers.ru"
            export SITE_ENV="staging"
            export VITE_SITE_URL="$SITE_URL"
            export VITE_SITE_ENV="$SITE_ENV"
            /usr/local/bin/bun run generate:seo

            echo "=== Remove previous build ==="
            rm -rf "$APP/.output"

            echo "=== Build ==="
            /usr/local/bin/bun run build

            echo "=== Restart application ==="
            sudo -n systemctl restart new-ponton-piers.service

            echo "=== Check application ==="
            sudo -n systemctl is-active --quiet new-ponton-piers.service

            echo "=== Deployment successful ==="

  healthcheck:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Check published SEO content over HTTPS
        run: |
          set -euo pipefail
          check_page() {
            url="$1"
            expected="$2"
            echo "=== Checking $url ==="
            html="$(curl -fsSL --max-time 30 "$url")"
            if ! printf '%s' "$html" | grep -Fq "$expected"; then
              echo "Expected text not found: $expected"
              exit 1
            fi
            echo "Found expected text: $expected"
          }
          check_public_routes() {
            echo "=== Checking HTTP status of every public route ==="
            routes=(
              "/"
              "/plavuchie-konstrukcii"
              "/pirsy-prichaly"
              "/plavuchie-garazhi-ellingi"
              "/pontony-dlya-hausbota"
              "/pontony-dlya-bani"
              "/pontony-dlya-besedki"
              "/pontony-dlya-sceny"
              "/pontony-dlya-katerov"
              "/pontony-dlya-restorana"
              "/pontony-dlya-sadkov"
              "/uslugi"
              "/registraciya-plavuchih-konstrukcii"
              "/dogovor-vodopolzovaniya"
              "/texnicheskoe-obsluzhivanie-pirsov"
              "/o-kompanii"
              "/proizvodstvo"
              "/otzyvy"
              "/faq"
              "/kontakty"
              "/kalkulyator"
              "/privacy"
              "/soglasie"
              "/blog"
              "/blog/kak-vybrat-ponton"
              "/blog/pnd-ili-metall"
              "/blog/podgotovka-mesta-pirs"
              "/blog/dok-dlya-katera"
            )
            for path in "${routes[@]}"; do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://new.ponton-piers.ru${path}")"
              if [ "$code" != "200" ]; then
                echo "Public route failed: $path (HTTP $code)"
                return 1
              fi
              echo "HTTP 200: $path"
            done
          }
          check_not_found_route() {
            echo "=== Validating unknown-route SEO fallback ==="
            html="$(curl -sSL --max-time 30 https://new.ponton-piers.ru/__audit_missing_route__)"
            printf '%s' "$html" | grep -Fq "Страница не найдена"
            printf '%s' "$html" | grep -Fq "noindex, follow"
            echo "Unknown routes render a localized not-found page and noindex"
          }
          check_staging_seo_files() {
            echo "=== Validating staging robots.txt and sitemap.xml ==="
            robots="$(curl -fsSL --max-time 30 https://new.ponton-piers.ru/robots.txt)"
            sitemap="$(curl -fsSL --max-time 30 https://new.ponton-piers.ru/sitemap.xml)"
            printf '%s' "$robots" | grep -Fxq "Disallow: /"
            if printf '%s' "$robots" | grep -Fq "Sitemap:"; then
              echo "Staging robots.txt must not advertise a sitemap"
              return 1
            fi
            printf '%s' "$sitemap" | grep -Fq "<urlset"
            if printf '%s' "$sitemap" | grep -Fq "<url>"; then
              echo "Staging sitemap must not contain indexable URLs"
              return 1
            fi
            if printf '%s' "$sitemap" | grep -Fq "new.ponton-piers.ru"; then
              echo "Staging sitemap must not contain staging URLs"
              return 1
            fi
            echo "Staging robots.txt blocks crawling and sitemap.xml contains zero URLs"
          }

          for i in 1 2 3 4 5; do
            echo "=== Content check attempt $i ==="
            if check_page "https://new.ponton-piers.ru/o-kompanii" "Решения для частных и коммерческих объектов" &&
               check_page "https://new.ponton-piers.ru/proizvodstvo" "Как организовано изготовление" &&
               check_page "https://new.ponton-piers.ru/registraciya-plavuchih-konstrukcii" "Сначала определяем статус объекта" &&
               check_page "https://new.ponton-piers.ru/dogovor-vodopolzovaniya" "Сначала определяем подходящий порядок" &&
               check_page "https://new.ponton-piers.ru/texnicheskoe-obsluzhivanie-pirsov" "Обслуживание по фактическому состоянию" &&
               check_page "https://new.ponton-piers.ru/privacy" "ООО «ВУОКСА»" &&
               check_page "https://new.ponton-piers.ru/soglasie" "Согласие на обработку персональных данных" &&
               check_page "https://new.ponton-piers.ru/kalkulyator" "Я даю согласие на обработку персональных данных" &&
               check_not_found_route &&
               check_page "https://new.ponton-piers.ru/" "noindex, follow" &&
               check_page "https://new.ponton-piers.ru/robots.txt" "Disallow: /" &&
               check_page "https://new.ponton-piers.ru/sitemap.xml" "<urlset" &&
               check_staging_seo_files &&
               check_public_routes &&
               check_page "https://new.ponton-piers.ru/proekty" "Решения для частных и коммерческих объектов"; then
              exit 0
            fi
            sleep 5
          done
          echo "Published SEO content health check failed"
          exit 1
