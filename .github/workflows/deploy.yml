name: Deploy New Ponton Piers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e

            REPO=/var/www/www-root/data/www/new.ponton-piers.ru
            APP=$REPO/app

            cd "$APP"

            echo "=== Download source ==="
            TMP=$(mktemp -d)
            trap 'rm -rf "$TMP"' EXIT
            curl -fsSL "https://github.com/felixpetro/new-ponton-piers.ru/archive/refs/heads/main.tar.gz" -o "$TMP/source.tar.gz"
            tar -xzf "$TMP/source.tar.gz" -C "$TMP"
            SRC=$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | head -n 1)

            echo "=== Sync application ==="
            # Keep server-managed files (.git, .github and web-server config) untouched.
            cp -a "$SRC/app"/. "$APP"/

            echo "=== Install dependencies ==="
            /usr/local/bin/bun install --frozen-lockfile

            echo "=== Build ==="
            /usr/local/bin/bun run build

            echo "=== Restart application ==="
            sudo -n systemctl restart new-ponton-piers.service

            echo "=== Check application ==="
            sudo -n systemctl is-active --quiet new-ponton-piers.service

            echo "=== Deployment successful ==="
